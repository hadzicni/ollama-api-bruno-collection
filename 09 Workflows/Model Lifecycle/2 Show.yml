info:
  name: 2 · Show
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/show"
  body:
    type: json
    data: |-
      {
        "model": "{{smallModel}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Modell kann Text generieren", function () {
          expect(res.getBody().capabilities).to.include("completion");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
