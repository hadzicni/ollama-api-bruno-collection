info:
  name: 3 · Create Custom Model
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/create"
  body:
    type: json
    data: |-
      {
        "model": "bruno-lifecycle-test",
        "from": "{{smallModel}}",
        "system": "You only answer with the word PONG.",
        "parameters": {
          "temperature": 0,
          "num_predict": 10
        },
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Create erfolgreich", function () {
          expect(res.getBody().status).to.equal("success");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
