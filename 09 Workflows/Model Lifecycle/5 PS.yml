info:
  name: 5. Check Running
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/ps"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Test model is loaded", function () {
          const names = res.getBody().models.map(m => m.name);
          expect(names.some(n => n.startsWith("bruno-lifecycle-test"))).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
