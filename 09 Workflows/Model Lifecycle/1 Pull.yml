info:
  name: 1 · Pull
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/pull"
  body:
    type: json
    data: |-
      {
        "model": "{{smallModel}}",
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Pull erfolgreich", function () {
          expect(res.getBody().status).to.equal("success");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
