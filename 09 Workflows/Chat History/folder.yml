docs:
  content: |-
    # Chat History

    Shows how to carry a conversation across multiple requests. The history lives in the
    runtime variable `chatHistory` and grows with every request.

    1. **Start** - sets the system prompt and first question, stores the answer
    2. **Follow-up** - appends a follow-up question to the existing history
    3. **Summary** - has the model summarize the entire conversation
  type: text/markdown
