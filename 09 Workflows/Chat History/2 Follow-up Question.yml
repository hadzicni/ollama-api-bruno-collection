info:
  name: 2. Follow-up Question
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const history = JSON.parse(bru.getVar("chatHistory") || "[]");
        if (!history.length) throw new Error("Run '1. Start Conversation' first.");

        history.push({ role: "user", content: "And was there ever water there? How can we tell?" });
        bru.setVar("chatHistory", JSON.stringify(history));

        const body = req.getBody();
        body.messages = history;
        req.setBody(body);
        console.log("Sending history with " + history.length + " messages");
    - type: after-response
      code: |-
        const msg = res.getBody()?.message;
        if (msg) {
          const history = JSON.parse(bru.getVar("chatHistory"));
          history.push({ role: "assistant", content: msg.content });
          bru.setVar("chatHistory", JSON.stringify(history));
          console.log("Assistant: " + msg.content);
        }
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant message present", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
