docs:
  content: |-
    # Mini RAG (Retrieval Augmented Generation)

    A complete RAG pipeline in three requests - no vector database required:

    1. **Index** - create embeddings for a small knowledge base (stored in `ragIndex`)
    2. **Retrieve** - embed the question and find the best matching documents via cosine similarity
    3. **Answer** - the model answers the question using only the retrieved context

    To change the question, set the runtime variable `ragQuestion` (default is set in the pre-request script of *2. Retrieve Context*).
  type: text/markdown
