docs:
  content: |-
    # 📚 Mini-RAG (Retrieval Augmented Generation)

    Eine komplette RAG-Pipeline in drei Requests – ganz ohne Vektordatenbank:

    1. **Index** – Embeddings für eine kleine Wissensbasis erzeugen (in `ragIndex` gespeichert)
    2. **Retrieve** – Frage einbetten und per Cosine Similarity die passendsten Dokumente finden
    3. **Answer** – Das Modell beantwortet die Frage nur anhand des gefundenen Kontexts

    Frage ändern: Variable `ragQuestion` im Request *2 · Retrieve* (Tab *Vars*) bzw. im Pre-Request-Script.
  type: text/markdown
