info:
  name: 3 · Antwort mit Kontext
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [
          {
            "role": "system",
            "content": "Beantworte die Frage ausschließlich anhand des folgenden Kontexts. Wenn die Antwort nicht im Kontext steht, sage \"Dazu habe ich keine Informationen.\"\n\nKontext:\n{{ragContext}}"
          },
          {
            "role": "user",
            "content": "{{ragQuestion}}"
          }
        ],
        "stream": false,
        "options": {
          "temperature": 0
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const msg = res.getBody()?.message;
        if (msg) console.log("💡 " + msg.content);
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant-Nachricht vorhanden", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

        test("Antwort nennt die Garantie", function () {
          expect(res.getBody().message.content).to.match(/3|drei/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
