info:
  name: 3. Answer with Context
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [
          {
            "role": "system",
            "content": "Answer the question using only the following context. If the answer is not in the context, say \"I don't have information about that.\"\n\nContext:\n{{ragContext}}"
          },
          {
            "role": "user",
            "content": "{{ragQuestion}}"
          }
        ],
        "stream": false,
        "options": {
          "temperature": 0
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const msg = res.getBody()?.message;
        if (msg) console.log("Answer: " + msg.content);
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant message present", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

        test("Answer mentions the warranty", function () {
          expect(res.getBody().message.content).to.match(/3|three/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
