info:
  name: 1. Index Documents
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/embed"
  body:
    type: json
    data: |-
      {
        "model": "{{embedModel}}",
        "input": [
          "Lamatech was founded in 2019 in Graz and has 48 employees.",
          "Lamatech support is available Monday to Friday from 8 am to 5 pm at support@lamatech.example.",
          "The \"HerdBox\" product is an on-premise LLM server with 2 GPUs and costs 12,900 euros.",
          "Lamatech employees get 30 days of vacation per year and may work remotely up to 3 days per week.",
          "The HerdBox ships with Ollama preinstalled and comes with a 3-year warranty.",
          "Lamatech plans to open an office in Zurich in 2026."
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const docs = req.getBody().input;
        const embeddings = res.getBody()?.embeddings;
        if (embeddings) {
          bru.setVar("ragIndex", JSON.stringify(docs.map((text, i) => ({ text, embedding: embeddings[i] }))));
          console.log("Indexed " + docs.length + " documents (" + embeddings[0].length + " dimensions)");
        }
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("One embedding per document", function () {
          expect(res.getBody().embeddings).to.have.lengthOf(req.getBody().input.length);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
