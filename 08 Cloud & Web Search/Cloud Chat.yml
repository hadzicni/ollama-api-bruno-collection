info:
  name: Cloud Chat
  type: http
  seq: 4

http:
  method: POST
  url: "{{cloudUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{cloudModel}}",
        "messages": [
          {
            "role": "user",
            "content": "Explain the difference between dense and mixture-of-experts models in three sentences."
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant message present", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Cloud Chat

  The native chat API directly on ollama.com - ideal for models too large to run locally
  (e.g. `gpt-oss:120b`, `qwen3-coder:480b`, `deepseek-v3.1:671b`).
