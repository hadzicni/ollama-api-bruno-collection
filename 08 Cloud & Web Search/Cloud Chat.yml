info:
  name: Cloud Chat
  type: http
  seq: 4

http:
  method: POST
  url: "{{cloudUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{cloudModel}}",
        "messages": [
          {
            "role": "user",
            "content": "Erkläre in drei Sätzen den Unterschied zwischen Dense- und Mixture-of-Experts-Modellen."
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant-Nachricht vorhanden", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Cloud Chat

  Die native Chat-API direkt auf ollama.com – ideal für Modelle, die lokal zu groß sind
  (z. B. `gpt-oss:120b`, `qwen3-coder:480b`, `deepseek-v3.1:671b`).
