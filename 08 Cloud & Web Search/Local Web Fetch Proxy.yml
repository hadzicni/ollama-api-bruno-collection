info:
  name: Local Web Fetch Proxy (experimental)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/experimental/web_fetch"
  body:
    type: json
    data: |-
      {
        "url": "https://docs.ollama.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Local Web Fetch Proxy ⚗️

  `POST /api/experimental/web_fetch` – Wie *Web Fetch*, aber über den lokalen, angemeldeten Server.
