info:
  name: Web Fetch
  type: http
  seq: 2

http:
  method: POST
  url: "{{cloudUrl}}/api/web_fetch"
  body:
    type: json
    data: |-
      {
        "url": "https://ollama.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Seiteninhalt geladen", function () {
          const b = res.getBody();
          expect(b.title).to.be.a("string");
          expect(b.content).to.not.be.empty;
          expect(b.links).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Web Fetch

  `POST https://ollama.com/api/web_fetch` – Lädt eine Webseite und liefert Titel, Inhalt (als Text) und Links.

  ```json
  {
    "title": "Ollama",
    "content": "[Cloud models](https://ollama.com/blog/cloud-models) are now available…",
    "links": ["https://ollama.com/", "https://ollama.com/models", "https://github.com/ollama/ollama"]
  }
  ```
