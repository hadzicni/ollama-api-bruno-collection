info:
  name: Cloud List Models
  type: http
  seq: 3

http:
  method: GET
  url: "{{cloudUrl}}/api/tags"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: console.log("☁️ Cloud-Modelle:", (res.getBody()?.models || []).map(m => m.name).join(", "));
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Cloud-Modelle", function () {
          expect(res.getBody().models).to.be.an("array").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Cloud List Models

  Alle über die Cloud-API verfügbaren Modelle.
