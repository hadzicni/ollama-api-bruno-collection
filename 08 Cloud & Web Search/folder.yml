docs:
  content: |-
    # Ollama Cloud & Web Search

    Requests sent directly to **https://ollama.com** - these require an API key:

    1. Create an account on [ollama.com](https://ollama.com)
    2. Create a key: <https://ollama.com/settings/keys>
    3. Store it in the active environment as the secret `ollamaCloudApiKey`

    Auth is configured at folder level as `Bearer {{ollamaCloudApiKey}}`.

    ## Two ways to use cloud models

    | Way | URL | Auth |
    |---|---|---|
    | Direct | `https://ollama.com/api/chat` | API key |
    | Via local server | `http://localhost:11434/api/chat` with a `*-cloud` model | `ollama signin` |
  type: text/markdown
