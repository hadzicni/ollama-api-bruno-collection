info:
  name: Cloud Model via Local Server
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{localCloudModel}}",
        "messages": [
          {
            "role": "user",
            "content": "Hello from Bruno! Roughly what kind of hardware are you running on?"
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant message present", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Cloud Model via Local Server

  Cloud models with the `-cloud` suffix are transparently forwarded to ollama.com by the **local** server.

  Prerequisite: `ollama signin` (see *Server > Who Am I*). One-time: `ollama pull {{localCloudModel}}`.

  The folder sends `Bearer {{ollamaCloudApiKey}}`, but the local server uses the `ollama signin` session.
