info:
  name: Chat (Thinking)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{thinkingModel}}",
        "messages": [
          {
            "role": "user",
            "content": "If 5 machines take 5 minutes to make 5 parts, how long do 100 machines take to make 100 parts?"
          }
        ],
        "think": true,
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const m = res.getBody()?.message;
        if (m?.thinking) console.log("Thinking:\n" + m.thinking + "\n\nAnswer:\n" + m.content);
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant message present", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

        test("Thinking included", function () {
          expect(res.getBody().message.thinking).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Thinking)

  `message.thinking` contains the reasoning, `message.content` the answer.

  When continuing the conversation, `thinking` can be sent back in the assistant message.
