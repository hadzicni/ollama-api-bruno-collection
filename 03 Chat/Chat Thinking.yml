info:
  name: Chat (Thinking)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{thinkingModel}}",
        "messages": [
          {
            "role": "user",
            "content": "Wenn 5 Maschinen 5 Minuten für 5 Teile brauchen – wie lange brauchen 100 Maschinen für 100 Teile?"
          }
        ],
        "think": true,
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const m = res.getBody()?.message;
        if (m?.thinking) console.log("🧠 Thinking:\n" + m.thinking + "\n\n💬 Antwort:\n" + m.content);
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant-Nachricht vorhanden", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

        test("Thinking enthalten", function () {
          expect(res.getBody().message.thinking).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Thinking)

  `message.thinking` enthält den Denkprozess, `message.content` die Antwort.

  Beim Weiterführen der Konversation kann `thinking` in der Assistant-Nachricht mitgeschickt werden.
