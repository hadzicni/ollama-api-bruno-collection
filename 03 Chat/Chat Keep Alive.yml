info:
  name: Chat (Keep Model Loaded)
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [
          {
            "role": "user",
            "content": "Just say hello."
          }
        ],
        "keep_alive": -1,
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant message present", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Keep Model Loaded)

  `keep_alive: -1` keeps the model in memory **indefinitely** (until restart or unload).

  | Value | Meaning |
  |---|---|
  | `"5m"` | Default: 5 minutes |
  | `"1h"`, `3600` | Duration as string or seconds |
  | `-1` | Forever |
  | `0` | Unload immediately |

  Can be set globally via the `OLLAMA_KEEP_ALIVE` environment variable.
