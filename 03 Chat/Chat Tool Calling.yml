info:
  name: Chat (Tool Calling)
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{toolModel}}",
        "messages": [
          {
            "role": "user",
            "content": "What is the weather like in Zurich right now, and what time is it there?"
          }
        ],
        "tools": [
          {
            "type": "function",
            "function": {
              "name": "get_current_weather",
              "description": "Get the current weather for a city",
              "parameters": {
                "type": "object",
                "properties": {
                  "city": {
                    "type": "string",
                    "description": "Name of the city, e.g. Berlin"
                  },
                  "unit": {
                    "type": "string",
                    "enum": [
                      "celsius",
                      "fahrenheit"
                    ],
                    "description": "Temperature unit"
                  }
                },
                "required": [
                  "city"
                ]
              }
            }
          },
          {
            "type": "function",
            "function": {
              "name": "get_current_time",
              "description": "Get the current time in a time zone",
              "parameters": {
                "type": "object",
                "properties": {
                  "timezone": {
                    "type": "string",
                    "description": "IANA time zone, e.g. Europe/Berlin"
                  }
                },
                "required": [
                  "timezone"
                ]
              }
            }
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const msg = res.getBody()?.message;
        if (msg?.tool_calls?.length) {
          bru.setVar("toolCallMessage", JSON.stringify(msg));
          msg.tool_calls.forEach(function (c) {
            console.log("Tool call:", c.function.name, JSON.stringify(c.function.arguments));
          });
          console.log("Next: run 'Chat (Tool Result)' to send the results back.");
        }
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Model calls tools", function () {
          const calls = res.getBody().message.tool_calls;
          expect(calls).to.be.an("array").and.not.be.empty;
          expect(calls[0].function).to.have.property("name");
          expect(calls[0].function.arguments).to.be.an("object");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Tool Calling)

  `tools` describes functions via JSON schema. When the model decides to call one, the response contains:

  ```json
  "message": {
    "role": "assistant",
    "content": "",
    "tool_calls": [
      { "function": { "name": "get_current_weather", "arguments": { "city": "Zurich" } } }
    ]
  }
  ```

  The assistant message is stored in `toolCallMessage` -> continue with **Chat (Tool Result)**.

  Suitable models: `qwen3`, `llama3.1`, `gpt-oss`, `mistral-small3.2`, ...
