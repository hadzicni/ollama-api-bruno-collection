info:
  name: Chat (Tool Result)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{toolModel}}",
        "messages": [
          {
            "role": "user",
            "content": "What is the weather like in Zurich right now, and what time is it there?"
          },
          {
            "role": "assistant",
            "content": "",
            "tool_calls": [
              {
                "function": {
                  "name": "get_current_weather",
                  "arguments": {
                    "city": "Zurich"
                  }
                }
              },
              {
                "function": {
                  "name": "get_current_time",
                  "arguments": {
                    "timezone": "Europe/Zurich"
                  }
                }
              }
            ]
          },
          {
            "role": "tool",
            "tool_name": "get_current_weather",
            "content": "{\"city\":\"Zurich\",\"temperature\":18,\"unit\":\"celsius\",\"condition\":\"partly cloudy\"}"
          },
          {
            "role": "tool",
            "tool_name": "get_current_time",
            "content": "{\"timezone\":\"Europe/Zurich\",\"time\":\"14:32\"}"
          }
        ],
        "tools": [
          {
            "type": "function",
            "function": {
              "name": "get_current_weather",
              "description": "Get the current weather for a city",
              "parameters": {
                "type": "object",
                "properties": {
                  "city": {
                    "type": "string",
                    "description": "Name of the city, e.g. Berlin"
                  },
                  "unit": {
                    "type": "string",
                    "enum": [
                      "celsius",
                      "fahrenheit"
                    ],
                    "description": "Temperature unit"
                  }
                },
                "required": [
                  "city"
                ]
              }
            }
          },
          {
            "type": "function",
            "function": {
              "name": "get_current_time",
              "description": "Get the current time in a time zone",
              "parameters": {
                "type": "object",
                "properties": {
                  "timezone": {
                    "type": "string",
                    "description": "IANA time zone, e.g. Europe/Berlin"
                  }
                },
                "required": [
                  "timezone"
                ]
              }
            }
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // If "Chat (Tool Calling)" ran before, reuse its real tool calls
        // and generate simulated tool results for them.
        const stored = bru.getVar("toolCallMessage");
        if (stored) {
          const assistant = JSON.parse(stored);
          const body = req.getBody();

          const fakeTools = {
            get_current_weather: function (args) {
              return { city: args.city, temperature: 18, unit: args.unit || "celsius", condition: "partly cloudy" };
            },
            get_current_time: function (args) {
              const tz = args.timezone || "Europe/Zurich";
              return { timezone: tz, time: new Date().toLocaleTimeString("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit" }) };
            }
          };

          const toolMessages = (assistant.tool_calls || []).map(function (call) {
            const fn = fakeTools[call.function.name];
            const result = fn ? fn(call.function.arguments || {}) : { error: "Unknown tool" };
            return { role: "tool", tool_name: call.function.name, content: JSON.stringify(result) };
          });

          body.messages = [body.messages[0], assistant].concat(toolMessages);
          req.setBody(body);
          console.log("Reused " + toolMessages.length + " tool result(s) from the previous tool call");
        }
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant message present", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

        test("Final answer without further tool calls", function () {
          expect(res.getBody().message.content).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Tool Result)

  Second step of the tool loop: tool results are sent back as `role: "tool"` with `tool_name`.
  The model uses them to produce the final answer.

  - Works *standalone* with the sample data in the body.
  - If **Chat (Tool Calling)** ran before, the pre-request script reuses the real tool calls
    and simulates matching results.
