info:
  name: Chat (Multi-Turn Conversation)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [
          {
            "role": "system",
            "content": "You are a helpful travel assistant."
          },
          {
            "role": "user",
            "content": "I am planning a weekend trip to Vienna."
          },
          {
            "role": "assistant",
            "content": "Wonderful! Vienna has a lot to offer: Schönbrunn Palace, St. Stephen's Cathedral, the Naschmarkt and of course its coffee house culture. What interests you most?"
          },
          {
            "role": "user",
            "content": "Food! Which three dishes do I have to try?"
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant message present", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Multi-Turn Conversation)

  Ollama is **stateless** - the entire history must be sent with every request.
  Previous model responses are added to the array as `role: "assistant"`.

  See *Workflows > Chat History* for a history that grows automatically.
