info:
  name: Chat (Vision)
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{visionModel}}",
        "messages": [
          {
            "role": "user",
            "content": "Was ist auf diesem Bild zu sehen? Welche Stimmung vermittelt es?",
            "images": ["{{imageBase64}}"]
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Lädt das Beispielbild ({{imageUrl}}) einmalig herunter und legt es Base64-kodiert
        // in der Laufzeitvariable "imageBase64" ab. Eigenes Bild? Einfach imageUrl ändern
        // und die Variable "imageBase64" zurücksetzen (Runtime Variables → löschen).
        const cachedFor = bru.getVar("imageBase64Source");
        const imageUrl = bru.interpolate("{{imageUrl}}");

        if (!bru.getVar("imageBase64") || cachedFor !== imageUrl) {
          const axios = require("axios");
          const response = await axios.get(imageUrl, {
            responseType: "arraybuffer",
            headers: { "User-Agent": "Bruno-Ollama-Collection/1.0" }
          });
          bru.setVar("imageBase64", Buffer.from(response.data).toString("base64"));
          bru.setVar("imageBase64Source", imageUrl);
          console.log("🖼️ Bild geladen:", imageUrl);
        }
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Assistant-Nachricht vorhanden", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Vision)

  Bilder werden pro Nachricht im Feld `images` (Base64) mitgeschickt.
  Das Pre-Request-Script lädt `{{imageUrl}}` automatisch.
