docs:
  content: |-
    # Chat - `POST /api/chat`

    Generates the next message in a conversation. The history is sent in the `messages` array.

    ## Message Object

    | Field | Description |
    |---|---|
    | `role` | `system`, `user`, `assistant` or `tool` |
    | `content` | Text content |
    | `images` | Base64 images (optional) |
    | `thinking` | Thinking text of a previous assistant response (optional) |
    | `tool_calls` | Tool calls requested by the model |
    | `tool_name` | Name of the tool for `role: "tool"` |

    Other fields are the same as for generate: `tools`, `format`, `options`, `stream`, `think`, `keep_alive`, `logprobs`, `top_logprobs`.
  type: text/markdown
