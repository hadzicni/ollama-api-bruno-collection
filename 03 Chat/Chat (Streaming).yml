info:
  name: Chat (Streaming)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [
          {
            "role": "user",
            "content": "Tell me a very short bedtime story."
          }
        ],
        "stream": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Stream returns NDJSON", function () {
          expect(res.getHeader("content-type")).to.contain("application/x-ndjson");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Streaming)

  NDJSON stream; each line contains a `message.content` fragment. The last line has `done: true` and the statistics.
