info:
  name: Chat (Structured Output)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [
          {
            "role": "user",
            "content": "Tell me about Canada. Respond in JSON."
          }
        ],
        "stream": false,
        "format": {
          "type": "object",
          "properties": {
            "name": {
              "type": "string"
            },
            "capital": {
              "type": "string"
            },
            "population": {
              "type": "integer"
            },
            "languages": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          },
          "required": [
            "name",
            "capital",
            "languages"
          ]
        },
        "options": {
          "temperature": 0
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: try { console.log("Structured response:", JSON.parse(res.getBody().message.content)); } catch (e) {}
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response matches the schema", function () {
          const data = JSON.parse(res.getBody().message.content);
          expect(data).to.include.keys("name", "capital", "languages");
          expect(data.languages).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat (Structured Output)

  A JSON schema in `format` enforces an exact response structure - ideal for data extraction.
