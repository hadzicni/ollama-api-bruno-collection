info:
  name: Chat
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/chat"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [
          {
            "role": "user",
            "content": "Hallo! Was kannst du alles?"
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Generierung abgeschlossen", function () {
          expect(res.getBody().done).to.equal(true);
        });

        test("Assistant-Nachricht vorhanden", function () {
          const msg = res.getBody().message;
          expect(msg.role).to.equal("assistant");
          expect(msg.content).to.be.a("string");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message.role
      operator: eq
      value: assistant
    - expression: res.body.done
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat

