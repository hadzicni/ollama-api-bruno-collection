docs:
  content: |-
    # Anthropic Compatibility

    Ollama supports the **Anthropic Messages API** under `/v1/messages` - this lets tools like Claude Code
    or the Anthropic SDK run against local models:

    ```bash
    export ANTHROPIC_BASE_URL=http://localhost:11434
    export ANTHROPIC_AUTH_TOKEN=ollama
    ```

    The `x-api-key` and `anthropic-version` headers are set at folder level.

    **Supported:** messages, streaming, system prompts, multi-turn, vision (Base64), tools, tool results, thinking

    **Not supported:** `tool_choice`, token counting, prompt caching, batches, URL images
  type: text/markdown
