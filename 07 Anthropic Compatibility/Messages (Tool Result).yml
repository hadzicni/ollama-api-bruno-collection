info:
  name: Messages (Tool Result)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/v1/messages"
  body:
    type: json
    data: |-
      {
        "model": "{{toolModel}}",
        "max_tokens": 1024,
        "tools": [
          {
            "name": "get_current_weather",
            "description": "Get the current weather for a city",
            "input_schema": {
              "type": "object",
              "properties": { "city": { "type": "string" } },
              "required": ["city"]
            }
          }
        ],
        "messages": [
          { "role": "user", "content": "Do I need an umbrella in Berlin today?" },
          {
            "role": "assistant",
            "content": [
              { "type": "tool_use", "id": "{{anthropicToolUseId}}", "name": "get_current_weather", "input": { "city": "Berlin" } }
            ]
          },
          {
            "role": "user",
            "content": [
              {
                "type": "tool_result",
                "tool_use_id": "{{anthropicToolUseId}}",
                "content": "{\"city\":\"Berlin\",\"condition\":\"heavy rain\",\"precipitation_probability\":90,\"temperature\":12}"
              }
            ]
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Fallback ID in case "Messages (Tools)" has not been run before
        if (!bru.getVar("anthropicToolUseId")) bru.setVar("anthropicToolUseId", "toolu_bruno_example_01");
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Final text response", function () {
          const b = res.getBody();
          expect(b.stop_reason).to.equal("end_turn");
          expect(b.content.find(c => c.type === "text").text).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Messages (Tool Result)

  Tool results are sent back as a `tool_result` block in a **user** message, linked via `tool_use_id`.
