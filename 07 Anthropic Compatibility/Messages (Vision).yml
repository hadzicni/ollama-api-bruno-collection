info:
  name: Messages (Vision)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/v1/messages"
  body:
    type: json
    data: |-
      {
        "model": "{{visionModel}}",
        "max_tokens": 512,
        "messages": [
          {
            "role": "user",
            "content": [
              {
                "type": "image",
                "source": { "type": "base64", "media_type": "image/jpeg", "data": "{{imageBase64}}" }
              },
              { "type": "text", "text": "Describe this image in one sentence." }
            ]
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Downloads the sample image ({{imageUrl}}) once and stores it Base64-encoded
        // in the runtime variable "imageBase64". To use your own image, change imageUrl
        // in the environment - the image is re-downloaded automatically.
        const cachedFor = bru.getVar("imageBase64Source");
        const imageUrl = bru.interpolate("{{imageUrl}}");

        if (!bru.getVar("imageBase64") || cachedFor !== imageUrl) {
          const axios = require("axios");
          const response = await axios.get(imageUrl, {
            responseType: "arraybuffer",
            headers: { "User-Agent": "Bruno-Ollama-Collection/1.0" }
          });
          bru.setVar("imageBase64", Buffer.from(response.data).toString("base64"));
          bru.setVar("imageBase64Source", imageUrl);
          console.log("Image loaded:", imageUrl);
        }
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Image description", function () {
          expect(res.getBody().content[0].text).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Messages (Vision)

  Images as an `image` block with `source.type: "base64"`. URL sources are not supported.
