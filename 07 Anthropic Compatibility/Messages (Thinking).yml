info:
  name: Messages (Extended Thinking)
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/v1/messages"
  body:
    type: json
    data: |-
      {
        "model": "{{thinkingModel}}",
        "max_tokens": 4096,
        "thinking": {
          "type": "enabled",
          "budget_tokens": 2048
        },
        "messages": [
          {
            "role": "user",
            "content": "Three friends split a $75 bill. One pays twice as much as each of the other two. How much does each pay?"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        (res.getBody()?.content || []).forEach(function (c) {
          if (c.type === "thinking") console.log("Thinking: " + c.thinking);
          if (c.type === "text") console.log("Answer: " + c.text);
        });
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("thinking and text blocks", function () {
          const types = res.getBody().content.map(c => c.type);
          expect(types).to.include("thinking");
          expect(types).to.include("text");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Messages (Extended Thinking)

  `thinking: {"type": "enabled", "budget_tokens": N}` enables thinking.
  The response contains a `thinking` block before the `text` block.
