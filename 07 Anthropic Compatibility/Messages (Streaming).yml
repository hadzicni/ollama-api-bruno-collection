info:
  name: Messages (Streaming)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/messages"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "max_tokens": 512,
        "stream": true,
        "messages": [
          {
            "role": "user",
            "content": "Write a limerick about Bruno, the API client."
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Stream returns server-sent events", function () {
          expect(res.getHeader("content-type")).to.contain("text/event-stream");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Messages (Streaming)

  SSE events in Anthropic format:

  ```
  event: message_start
  event: content_block_start
  event: content_block_delta   -> {"type":"text_delta","text":"..."}
  event: content_block_stop
  event: message_delta         -> stop_reason, usage
  event: message_stop
  ```
