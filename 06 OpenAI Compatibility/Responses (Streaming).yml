info:
  name: Responses (Streaming)
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/v1/responses"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "input": "Name five programming languages with a one-sentence description each.",
        "stream": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Stream returns server-sent events", function () {
          expect(res.getHeader("content-type")).to.contain("text/event-stream");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Responses (Streaming)

  Semantic SSE events:

  ```
  event: response.created
  event: response.output_item.added
  event: response.output_text.delta
  ...
  event: response.output_text.done
  event: response.completed
  ```
