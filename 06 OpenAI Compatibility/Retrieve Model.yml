info:
  name: Retrieve Model
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/models/{{model}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Model object", function () {
          expect(res.getBody().object).to.equal("model");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
