info:
  name: Chat Completions (Tools)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/v1/chat/completions"
  body:
    type: json
    data: |-
      {
        "model": "{{toolModel}}",
        "messages": [
          {
            "role": "user",
            "content": "What is the weather like in Munich?"
          }
        ],
        "tools": [
          {
            "type": "function",
            "function": {
              "name": "get_current_weather",
              "description": "Get the current weather for a city",
              "parameters": {
                "type": "object",
                "properties": {
                  "city": {
                    "type": "string",
                    "description": "Name of the city, e.g. Berlin"
                  },
                  "unit": {
                    "type": "string",
                    "enum": [
                      "celsius",
                      "fahrenheit"
                    ],
                    "description": "Temperature unit"
                  }
                },
                "required": [
                  "city"
                ]
              }
            }
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Tool call in OpenAI format", function () {
          const choice = res.getBody().choices[0];
          expect(choice.finish_reason).to.equal("tool_calls");
          const call = choice.message.tool_calls[0];
          expect(call.type).to.equal("function");
          expect(call.function.arguments).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Chat Completions (Tools)

  In the OpenAI format, `function.arguments` is a **JSON string** (not an object as in `/api/chat`),
  and every tool call has an `id`. Tool results are sent back with `role: "tool"` and `tool_call_id`.
