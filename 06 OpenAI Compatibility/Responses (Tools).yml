info:
  name: Responses (Tools)
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/v1/responses"
  body:
    type: json
    data: |-
      {
        "model": "{{toolModel}}",
        "input": [
          {
            "role": "user",
            "content": "How warm is it in Vienna right now?"
          }
        ],
        "tools": [
          {
            "type": "function",
            "name": "get_current_weather",
            "description": "Get the current weather for a city",
            "parameters": {
              "type": "object",
              "properties": {
                "city": {
                  "type": "string",
                  "description": "Name of the city, e.g. Berlin"
                },
                "unit": {
                  "type": "string",
                  "enum": [
                    "celsius",
                    "fahrenheit"
                  ],
                  "description": "Temperature unit"
                }
              },
              "required": [
                "city"
              ]
            }
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("function_call in output", function () {
          const calls = res.getBody().output.filter(o => o.type === "function_call");
          expect(calls).to.not.be.empty;
          console.log("Tool call:", calls[0].name, calls[0].arguments);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Responses (Tools)

  In the Responses API, tools are defined **flat** (`name` and `parameters` directly on the tool, without a `function` wrapper).
  Calls appear as output items of type `function_call`; results are sent back in the next `input` as
  `{"type": "function_call_output", "call_id": "...", "output": "..."}`.
