docs:
  content: |-
    # OpenAI Compatibility

    Ollama implements parts of the **OpenAI API** under `/v1`. Existing OpenAI SDKs work with:

    ```python
    from openai import OpenAI
    client = OpenAI(base_url="http://localhost:11434/v1", api_key="ollama")  # api_key is ignored
    ```

    | Endpoint | Method |
    |---|---|
    | `/v1/chat/completions` | POST |
    | `/v1/completions` | POST |
    | `/v1/embeddings` | POST |
    | `/v1/models`, `/v1/models/{model}` | GET |
    | `/v1/responses` | POST (since v0.13.3, stateless) |

    Authentication (`Bearer {{apiKey}}`) is inherited from the collection.
  type: text/markdown
