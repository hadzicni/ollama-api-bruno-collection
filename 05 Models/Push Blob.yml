info:
  name: Push Blob (Upload File)
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/blobs/:digest"
  headers:
    - name: Content-Type
      value: application/octet-stream
  params:
    - name: digest
      value: "{{blobDigest}}"
      type: path
  body:
    type: file
    data:
      - filePath: ""
        contentType: application/octet-stream
        selected: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Blob uploaded", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Push Blob (Upload File)

  `POST /api/blobs/:digest` - Uploads a file so it can be referenced in `/api/create`.

  ## Flow: import your own GGUF

  1. Compute the digest: `shasum -a 256 my-model.gguf`
  2. Set `blobDigest` = `sha256:<hash>`
  3. Select the file in the **Body** tab and send -> `201 Created`
  4. Create the model:

  ```json
  POST /api/create
  {
    "model": "my-gguf-model",
    "files": { "my-model.gguf": "sha256:<hash>" }
  }
  ```

  `400 Bad Request` -> the digest does not match the file contents.
