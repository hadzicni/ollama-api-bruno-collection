info:
  name: Create Model (Custom Template)
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/create"
  body:
    type: json
    data: |-
      {
        "model": "{{customModelName}}-raw",
        "from": "{{model}}",
        "template": "{{- if .System }}### System:\n{{ .System }}\n\n{{ end }}### User:\n{{ .Prompt }}\n\n### Assistant:\n",
        "system": "Answer exclusively in bullet points.",
        "parameters": {
          "stop": [
            "### User:",
            "### System:"
          ]
        },
        "license": "MIT",
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Create Model (Custom Template)

  Overrides the prompt template with a custom **Go template** definition.

  Available variables: `.System`, `.Prompt`, `.Response`, `.Messages`, `.Tools`, `.Suffix`.

  Warning: a wrong template significantly degrades response quality - use only for experiments or your own models.
