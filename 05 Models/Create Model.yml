info:
  name: Create Model (from existing)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/create"
  body:
    type: json
    data: |-
      {
        "model": "{{customModelName}}",
        "from": "{{model}}",
        "system": "You are \"Bruno\", a friendly API testing assistant. You always answer briefly and with a touch of humor.",
        "parameters": {
          "temperature": 0.4,
          "num_ctx": 8192,
          "stop": [
            "<|eot_id|>"
          ]
        },
        "messages": [
          {
            "role": "user",
            "content": "Who are you?"
          },
          {
            "role": "assistant",
            "content": "I am Bruno - your assistant for everything APIs!"
          }
        ],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Create succeeded", function () {
          expect(res.getBody().status).to.equal("success");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Create Model (from existing)

  `POST /api/create` - Creates a new model based on an existing one - the API equivalent of a Modelfile.

  | Field | Modelfile | Description |
  |---|---|---|
  | `model` | - | Name of the new model |
  | `from` | `FROM` | Base model |
  | `system` | `SYSTEM` | System prompt |
  | `template` | `TEMPLATE` | Prompt template (Go template syntax) |
  | `parameters` | `PARAMETER` | Default options |
  | `messages` | `MESSAGE` | Example conversation (few-shot) |
  | `license` | `LICENSE` | License text(s) |
  | `adapters` | `ADAPTER` | LoRA adapters (file name -> digest) |
  | `files` | `FROM ./x.gguf` | GGUF/safetensors files (file name -> digest, see *Blobs*) |
  | `quantize` | `--quantize` | e.g. `q4_K_M`, `q8_0` |

  Then try it out: *Chat* with `model = {{customModelName}}`.
