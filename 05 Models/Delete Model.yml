info:
  name: Delete Model
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseUrl}}/api/delete"
  body:
    type: json
    data: |-
      {
        "model": "{{copyModelName}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Delete Model

  `DELETE /api/delete` - Removes a model and any layers that are no longer referenced.

  By default `{{copyModelName}}` is deleted (from *Copy Model*). To clean up, also enter
  `{{customModelName}}` and `{{customModelName}}-raw`.

  Response: `200 OK`, or `404` if the model does not exist.
