info:
  name: List Running Models
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/ps"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const models = res.getBody()?.models || [];
        if (!models.length) console.log("💤 Aktuell ist kein Modell geladen.");
        models.forEach(function (m) {
          const vramPct = m.size ? Math.round((m.size_vram / m.size) * 100) : 0;
          console.log("🟢 " + m.name + " | " + (m.size / 1024 ** 3).toFixed(2) + " GB | " + vramPct + "% GPU | Kontext: " + (m.context_length || "?") + " | entlädt: " + m.expires_at);
        });
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Liste geladener Modelle", function () {
          expect(res.getBody().models).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # List Running Models

  `GET /api/ps` – Aktuell in den Speicher geladene Modelle (CLI: `ollama ps`).

  ## Response

  ```json
  {
    "models": [
      {
        "name": "llama3.2:latest",
        "model": "llama3.2:latest",
        "size": 3825819519,
        "digest": "fe938a131f40e6f6d40083c9f0f430a515233eb2edaa6d72eb85c50d64f2300e",
        "details": { "family": "llama", "parameter_size": "3.2B", "quantization_level": "Q4_K_M" },
        "expires_at": "2025-10-17T16:47:07.93355-07:00",
        "size_vram": 3825819519,
        "context_length": 4096
      }
    ]
  }
  ```

  `size_vram / size` zeigt, wie viel des Modells auf der GPU liegt.
