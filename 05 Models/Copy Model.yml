info:
  name: Copy Model
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/copy"
  body:
    type: json
    data: |-
      {
        "source": "{{model}}",
        "destination": "{{copyModelName}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Copy Model

  `POST /api/copy` - Creates a copy under a new name. Layers are **not** duplicated
  (only a new manifest), so the copy uses practically no extra disk space.

  Response: `200 OK` with no body, or `404` if the source model does not exist.
