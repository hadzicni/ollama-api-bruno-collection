info:
  name: Push Model
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/push"
  body:
    type: json
    data: |-
      {
        "model": "{{ollamaUsername}}/{{customModelName}}",
        "insecure": false,
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Push Model

  `POST /api/push` - Uploads a model to the Ollama registry.

  Prerequisites:
  1. An account on [ollama.com](https://ollama.com) and `ollama signin`, or your public key added under *Settings > Keys*
  2. The model in the `<username>/<model>` namespace - rename it first via *Copy Model* if needed:
     `{"source": "{{customModelName}}", "destination": "{{ollamaUsername}}/{{customModelName}}"}`
