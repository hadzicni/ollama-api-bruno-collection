info:
  name: Check Blob Exists
  type: http
  seq: 13

http:
  method: HEAD
  url: "{{baseUrl}}/api/blobs/:digest"
  params:
    - name: digest
      value: "{{blobDigest}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Blob status checked", function () {
          const s = res.getStatus();
          expect([200, 404]).to.include(s);
          console.log(s === 200 ? "Blob exists" : "Blob not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Check Blob Exists

  `HEAD /api/blobs/:digest` - Checks whether a file (GGUF, safetensors, adapter) already exists on the server.

  - `200 OK` -> exists
  - `404 Not Found` -> upload it with *Push Blob*

  Compute the digest: `shasum -a 256 model.gguf` -> `sha256:<hash>`
