info:
  name: Pull Model
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/pull"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Pull succeeded", function () {
          expect(res.getBody().status).to.equal("success");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Pull Model

  `POST /api/pull` - Downloads a model from the [Ollama library](https://ollama.com/library)
  or updates it. Layers that already exist are skipped.

  | Field | Description |
  |---|---|
  | `model` | Model name, optionally with tag (`qwen3:8b`) or namespace (`user/model`) |
  | `insecure` | Allow insecure registry connections |
  | `stream` | `false` -> a single response at the end: `{"status": "success"}` |

  Hugging Face GGUFs work too: `hf.co/bartowski/Llama-3.2-1B-Instruct-GGUF:Q4_K_M`
