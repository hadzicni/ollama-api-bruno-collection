info:
  name: Embed
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/embed"
  body:
    type: json
    data: |-
      {
        "model": "{{embedModel}}",
        "input": "Lamas sind Mitglieder der Kamelfamilie."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Ein Embedding-Vektor", function () {
          const e = res.getBody().embeddings;
          expect(e).to.have.lengthOf(1);
          expect(e[0]).to.be.an("array").and.not.be.empty;
          console.log("📐 Dimensionen:", e[0].length);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.embeddings
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Embed

