info:
  name: Embeddings (Legacy)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/embeddings"
  body:
    type: json
    data: |-
      {
        "model": "{{embedModel}}",
        "prompt": "This is the deprecated embeddings endpoint."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Single vector in the 'embedding' field", function () {
          expect(res.getBody().embedding).to.be.an("array").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Embeddings (Legacy)

  `POST /api/embeddings` - **deprecated**, superseded by `/api/embed`.

  Differences:
  - `prompt` field instead of `input` (a single string only)
  - Response `embedding` (one vector) instead of `embeddings` (array)
  - Vectors are **not** normalized
