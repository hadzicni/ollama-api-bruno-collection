docs:
  content: |-
    # Embeddings

    Vector representations of text for semantic search, clustering and RAG.

    | Field | Description |
    |---|---|
    | `model` | Embedding model (e.g. `embeddinggemma`, `nomic-embed-text`, `mxbai-embed-large`, `qwen3-embedding`) |
    | `input` | String or array of strings |
    | `truncate` | Truncate inputs that are too long (default `true`); with `false` -> error |
    | `dimensions` | Number of dimensions (for models with Matryoshka support) |
    | `keep_alive`, `options` | Same as generate |

    Vectors are **L2-normalized** - cosine similarity = dot product.
  type: text/markdown
