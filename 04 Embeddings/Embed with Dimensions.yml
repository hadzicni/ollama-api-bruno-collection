info:
  name: Embed (Dimensions & Truncate)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/embed"
  body:
    type: json
    data: |-
      {
        "model": "{{embedModel}}",
        "input": "Compact vectors save storage space in the vector database.",
        "dimensions": 256,
        "truncate": true,
        "keep_alive": "{{keepAlive}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Vector has 256 dimensions", function () {
          expect(res.getBody().embeddings[0]).to.have.lengthOf(256);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Embed (Dimensions & Truncate)

  `dimensions` shortens the vector to the requested length - only meaningful for models trained with
  *Matryoshka Representation Learning* (e.g. `embeddinggemma`: 768 -> 512/256/128).

  `truncate: false` returns an error if the input exceeds the context window.
