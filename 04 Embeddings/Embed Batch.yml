info:
  name: Embed (Batch)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/embed"
  body:
    type: json
    data: |-
      {
        "model": "{{embedModel}}",
        "input": [
          "The dog is playing in the garden.",
          "A puppy is running around on the lawn outside.",
          "The stock market closed with losses today."
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Three embeddings", function () {
          expect(res.getBody().embeddings).to.have.lengthOf(3);
        });

        test("Similar sentences are closer together", function () {
          const [a, b, c] = res.getBody().embeddings;
          const dot = (x, y) => x.reduce((s, v, i) => s + v * y[i], 0);
          const simAB = dot(a, b), simAC = dot(a, c);
          console.log("dog <-> puppy:", simAB.toFixed(3), "| dog <-> stock market:", simAC.toFixed(3));
          expect(simAB).to.be.above(simAC);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Embed (Batch)

  Multiple texts in one request. The test computes the **cosine similarity** and checks that
  semantically similar sentences (dog/puppy) are closer together than unrelated ones (dog/stock market).
