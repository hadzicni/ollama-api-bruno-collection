opencollection: 1.0.0

info:
  name: Ollama API
  version: 1.0.0

config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{apiKey}}"
  scripts:
    - type: after-response
      code: |-
        // Performance stats for all native Ollama responses (non-streaming).
        // Printed to the console and stored in the runtime variable "lastTokensPerSecond".
        const body = res.getBody();
        if (body && typeof body === "object" && body.eval_count && body.eval_duration) {
          const seconds = body.eval_duration / 1e9;
          const tps = body.eval_count / seconds;
          const promptTps = body.prompt_eval_duration
            ? body.prompt_eval_count / (body.prompt_eval_duration / 1e9)
            : null;

          bru.setVar("lastTokensPerSecond", tps.toFixed(1));
          console.log(
            body.model + ": " + body.eval_count + " tokens in " + seconds.toFixed(2) + "s -> " +
            tps.toFixed(1) + " tok/s" +
            (promptTps ? " | Prompt: " + body.prompt_eval_count + " tokens @ " + promptTps.toFixed(1) + " tok/s" : "") +
            (body.load_duration ? " | Load: " + (body.load_duration / 1e9).toFixed(2) + "s" : "")
          );
        }

docs:
  content: |-
    # Ollama API - Bruno Collection

    A comprehensive collection for the **Ollama REST API** - local, on your network, or via **Ollama Cloud**.

    ## Quick Start

    1. Start Ollama: `ollama serve` (or open the Ollama app)
    2. Select the **Local** environment in the top right
    3. Pull the required models (one-time):

    ```bash
    ollama pull llama3.2        # {{model}}          - default chat model
    ollama pull qwen3           # {{thinkingModel}} / {{toolModel}} - thinking & tools
    ollama pull gpt-oss:20b     # {{reasoningModel}} - reasoning levels (low/medium/high)
    ollama pull gemma3          # {{visionModel}}    - vision
    ollama pull embeddinggemma  # {{embedModel}}     - embeddings
    ollama pull qwen2.5-coder   # {{codeModel}}      - code / fill-in-the-middle
    ```

    Alternatively run **Models > Pull Model** directly from Bruno.

    ## Structure

    | Folder | Contents |
    |---|---|
    | Server | Health check, version, status, account |
    | Generate | `/api/generate` - completion, JSON, thinking, vision, FIM, logprobs, ... |
    | Chat | `/api/chat` - conversations, tools, structured outputs, vision, ... |
    | Embeddings | `/api/embed` and legacy `/api/embeddings` |
    | Models | Tags, PS, show, pull, push, copy, create, delete, blobs |
    | OpenAI Compatibility | `/v1/chat/completions`, `/v1/responses`, `/v1/embeddings`, ... |
    | Anthropic Compatibility | `/v1/messages` incl. tools, thinking and vision |
    | Cloud & Web Search | `ollama.com` API, web search, web fetch |
    | Workflows | Chained flows: chat history, mini RAG, model lifecycle |

    ## Environments

    - **Local** - `http://localhost:11434`
    - **Remote Server** - Ollama on another machine (set `OLLAMA_HOST=0.0.0.0`)
    - **Ollama Cloud** - `https://ollama.com` with an API key (secret `apiKey`)

    **Web search, web fetch and cloud** requests require an API key: <https://ollama.com/settings/keys>
    Add it to the environment as the secret `ollamaCloudApiKey`.

    ## Collection Features

    - **Tests and assertions** in almost every request (ideal for the *Collection Runner*)
    - **Tokens/s stats**: generation speed is printed to the console after every native response
    - **Automatic image loading** for vision requests (Base64 via pre-request script)
    - **Workflows** that chain requests via runtime variables

    ## Notes

    - Timeouts are disabled (`timeout: 0`) because loading large models can take a while.
    - `"stream": false` is used by default so tests can inspect the complete response. The *Streaming* requests demonstrate the NDJSON/SSE format.
    - Vision scripts use `axios` and `Buffer` - if Safe Mode blocks this, switch the collection to **Developer Mode**.
    - Official docs: <https://docs.ollama.com/api>
  type: text/markdown
bundled: false

extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{baseUrl}}"
