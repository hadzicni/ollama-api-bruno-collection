opencollection: 1.0.0

info:
  name: Ollama API
  version: 1.0.0

config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{apiKey}}"
  scripts:
    - type: after-response
      code: |-
        // Performance-Statistik für alle nativen Ollama-Antworten (non-streaming).
        // Ergebnis landet in der Konsole und in der Laufzeitvariable "lastTokensPerSecond".
        const body = res.getBody();
        if (body && typeof body === "object" && body.eval_count && body.eval_duration) {
          const seconds = body.eval_duration / 1e9;
          const tps = body.eval_count / seconds;
          const promptTps = body.prompt_eval_duration
            ? body.prompt_eval_count / (body.prompt_eval_duration / 1e9)
            : null;

          bru.setVar("lastTokensPerSecond", tps.toFixed(1));
          console.log(
            "⚡ " + body.model + ": " + body.eval_count + " Tokens in " + seconds.toFixed(2) + "s → " +
            tps.toFixed(1) + " tok/s" +
            (promptTps ? " | Prompt: " + body.prompt_eval_count + " Tokens @ " + promptTps.toFixed(1) + " tok/s" : "") +
            (body.load_duration ? " | Load: " + (body.load_duration / 1e9).toFixed(2) + "s" : "")
          );
        }

docs:
  content: |-
    # 🦙 Ollama API – Bruno Collection

    Eine umfassende Collection für die **Ollama REST API** – lokal, im Netzwerk oder über **Ollama Cloud**.

    ## 🚀 Schnellstart

    1. Ollama starten: `ollama serve` (oder die Ollama-App öffnen)
    2. Oben rechts die Umgebung **Local** auswählen
    3. Benötigte Modelle laden (einmalig):

    ```bash
    ollama pull llama3.2        # {{model}}         – Standard-Chatmodell
    ollama pull qwen3           # {{thinkingModel}} / {{toolModel}} – Thinking & Tools
    ollama pull gpt-oss:20b     # {{reasoningModel}} – Reasoning-Level (low/medium/high)
    ollama pull gemma3          # {{visionModel}}   – Bilderkennung
    ollama pull embeddinggemma  # {{embedModel}}    – Embeddings
    ollama pull qwen2.5-coder   # {{codeModel}}     – Code / Fill-in-the-Middle
    ```

    Alternativ: **Models → Pull Model** direkt aus Bruno ausführen.

    ## 📁 Aufbau

    | Ordner | Inhalt |
    |---|---|
    | 🖥️ Server | Health-Check, Version, Status, Account |
    | ✍️ Generate | `/api/generate` – Completion, JSON, Thinking, Vision, FIM, Logprobs … |
    | 💬 Chat | `/api/chat` – Konversationen, Tools, Structured Outputs, Vision … |
    | 🧮 Embeddings | `/api/embed` & Legacy `/api/embeddings` |
    | 📦 Models | Tags, PS, Show, Pull, Push, Copy, Create, Delete, Blobs |
    | 🔌 OpenAI Compatibility | `/v1/chat/completions`, `/v1/responses`, `/v1/embeddings` … |
    | 🅰️ Anthropic Compatibility | `/v1/messages` inkl. Tools, Thinking & Vision |
    | ☁️ Cloud & Web Search | `ollama.com` API, Web Search, Web Fetch |
    | 🔁 Workflows | Verkettete Abläufe: Chat-Verlauf, Tool-Loop, Mini-RAG, Modell-Lebenszyklus |

    ## 🌍 Umgebungen

    - **Local** – `http://localhost:11434`
    - **Remote Server** – Ollama auf einem anderen Rechner (`OLLAMA_HOST=0.0.0.0` setzen)
    - **Ollama Cloud** – `https://ollama.com` mit API-Key (Secret `apiKey`)

    Für **Web Search / Web Fetch / Cloud** wird ein API-Key benötigt: <https://ollama.com/settings/keys>
    → in der Umgebung als Secret `ollamaCloudApiKey` eintragen.

    ## ✨ Features der Collection

    - **Tests & Assertions** in fast jedem Request (ideal für den *Collection Runner*)
    - **Tokens/s-Statistik**: Nach jeder nativen Antwort wird die Generierungsgeschwindigkeit in der Konsole ausgegeben
    - **Automatisches Bild-Laden** für Vision-Requests (Base64 via Pre-Request-Script)
    - **Workflows** mit Variablen-Verkettung zwischen Requests

    ## ℹ️ Hinweise

    - Timeouts sind deaktiviert (`timeout: 0`), da das Laden großer Modelle dauern kann.
    - Standardmäßig wird `"stream": false` verwendet, damit Tests die komplette Antwort prüfen können. Die *Streaming*-Requests zeigen das NDJSON/SSE-Format.
    - Vision-Scripts nutzen `axios` und `Buffer` – falls der Safe Mode dies blockiert, in den Collection-Settings auf **Developer Mode** umstellen.
    - Offizielle Doku: <https://docs.ollama.com/api>
  type: text/markdown
bundled: false

extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{baseUrl}}"
