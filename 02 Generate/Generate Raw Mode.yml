info:
  name: Generate (Raw Mode)
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "prompt": "<|start_header_id|>user<|end_header_id|>\n\nWhat is the capital of Austria?<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n",
        "raw": true,
        "stream": false,
        "options": {
          "num_predict": 50
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Raw Mode)

  With `raw: true`, **no prompt template** is applied - you provide the fully formatted prompt yourself.
  Useful for custom templates or base models.

  Note: the example uses the **Llama 3 chat format**. Adjust the template for other models
  (see *Models > Show Model* > `template`).
