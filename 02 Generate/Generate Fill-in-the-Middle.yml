info:
  name: Generate (Fill-in-the-Middle)
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{codeModel}}",
        "prompt": "def fibonacci(n: int) -> int:\n    \"\"\"Berechnet die n-te Fibonacci-Zahl.\"\"\"\n",
        "suffix": "\n\nprint(fibonacci(10))  # 55\n",
        "stream": false,
        "options": {
          "temperature": 0,
          "num_predict": 150
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody();
        if (b?.response) console.log("🧩 Eingefügter Code:\n" + b.response);
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Antwort enthält Text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Fill-in-the-Middle)

  Für Code-Completion: `prompt` ist der Code **vor** dem Cursor, `suffix` der Code **danach**.
  Das Modell erzeugt den fehlenden Teil dazwischen.

  Unterstützt von Code-Modellen mit FIM-Template, z. B. `qwen2.5-coder`, `codellama:code`, `starcoder2`, `codegemma`.
