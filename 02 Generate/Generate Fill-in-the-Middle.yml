info:
  name: Generate (Fill-in-the-Middle)
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{codeModel}}",
        "prompt": "def fibonacci(n: int) -> int:\n    \"\"\"Return the n-th Fibonacci number.\"\"\"\n",
        "suffix": "\n\nprint(fibonacci(10))  # 55\n",
        "stream": false,
        "options": {
          "temperature": 0,
          "num_predict": 150
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody();
        if (b?.response) console.log("Inserted code:\n" + b.response);
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Fill-in-the-Middle)

  For code completion: `prompt` is the code **before** the cursor, `suffix` the code **after** it.
  The model generates the missing part in between.

  Supported by code models with a FIM template, e.g. `qwen2.5-coder`, `codellama:code`, `starcoder2`, `codegemma`.
