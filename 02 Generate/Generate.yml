info:
  name: Generate
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "prompt": "Why is the sky blue? Answer in two sentences.",
        "stream": false,
        "keep_alive": "{{keepAlive}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Generation completed", function () {
          expect(res.getBody().done).to.equal(true);
        });

        test("Response contains text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.done
      operator: eq
      value: "true"
    - expression: res.body.response
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |2-
        # Generate

        The simplest form: one prompt, one complete response (`stream: false`).

        ## Response (abridged)

        ```json
        {
          "model": "llama3.2",
          "created_at": "2025-10-17T23:14:07.414671Z",
          "response": "The sky is blue because ...",
          "done": true,
          "done_reason": "stop",
          "total_duration": 174560334,
          "load_duration": 101397084,
          "prompt_eval_count": 11,
          "prompt_eval_duration": 13074791,
          "eval_count": 18,
          "eval_duration": 52479709
        }
        ```

        All `*_duration` values are in **nanoseconds**. Tokens/s = `eval_count / eval_duration * 1e9`.
      
  ## Key Parameters

  | Field | Type | Description |
  |---|---|---|
  | `model` | string | **Required.** Model name |
  | `prompt` | string | Input text |
  | `suffix` | string | Text *after* the insertion point (fill-in-the-middle) |
  | `images` | string[] | Base64-encoded images |
  | `format` | "json" \| object | JSON mode or JSON schema |
  | `system` | string | System prompt (overrides the Modelfile) |
  | `stream` | bool | Default `true` |
  | `think` | bool \| "low" \| "medium" \| "high" | Enable thinking |
  | `raw` | bool | Do not apply the prompt template |
  | `keep_alive` | string \| number | e.g. `"5m"`, `0` = unload immediately, `-1` = keep forever |
  | `logprobs` / `top_logprobs` | bool / int | Token probabilities |
  | `options` | object | `temperature`, `top_k`, `top_p`, `min_p`, `seed`, `stop`, `num_ctx`, `num_predict`, ... |
