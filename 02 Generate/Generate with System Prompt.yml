info:
  name: Generate with System Prompt
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "system": "You are a pirate. Always answer in pirate speak and in no more than three sentences.",
        "prompt": "Explain what a REST API is.",
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate with System Prompt

  `system` overrides the system prompt defined in the Modelfile for this single request.
