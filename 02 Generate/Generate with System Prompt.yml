info:
  name: Generate with System Prompt
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "system": "Du bist ein Pirat. Antworte immer im Piratenslang und maximal in drei Sätzen.",
        "prompt": "Erkläre, was eine REST API ist.",
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Antwort enthält Text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate with System Prompt

  `system` überschreibt den im Modelfile definierten System-Prompt für diesen einen Request.
