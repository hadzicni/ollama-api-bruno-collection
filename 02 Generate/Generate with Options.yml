info:
  name: Generate with Options
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "prompt": "Suggest three creative names for a coffee shop.",
        "stream": false,
        "options": {
          "temperature": 0.9,
          "top_k": 40,
          "top_p": 0.9,
          "min_p": 0.05,
          "repeat_penalty": 1.1,
          "repeat_last_n": 64,
          "num_ctx": 4096,
          "num_predict": 200,
          "seed": 42,
          "stop": [
            "\n\n\n"
          ]
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

        test("num_predict is respected", function () {
          expect(res.getBody().eval_count).to.be.at.most(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate with Options

  Runtime options override the Modelfile parameters.

  | Option | Description |
  |---|---|
  | `temperature` | Creativity (0 = deterministic, >1 = very random) |
  | `top_k` | Only consider the K most likely tokens |
  | `top_p` | Nucleus sampling (cumulative probability) |
  | `min_p` | Minimum probability relative to the most likely token |
  | `repeat_penalty` / `repeat_last_n` | Penalize repetition |
  | `num_ctx` | Context window in tokens |
  | `num_predict` | Max number of tokens to generate (`-1` = unlimited) |
  | `seed` | Seed for reproducible output |
  | `stop` | Stop sequences |
  | `num_gpu`, `num_thread`, `num_batch` | Hardware tuning |
