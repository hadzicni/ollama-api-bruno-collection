info:
  name: Generate (JSON Mode)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "prompt": "What color is the sky at different times of the day? Respond as JSON with the keys morning, noon and evening.",
        "format": "json",
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response is valid JSON", function () {
          const parsed = JSON.parse(res.getBody().response);
          expect(parsed).to.be.an("object");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (JSON Mode)

  `format: "json"` enforces syntactically valid JSON.

  > The prompt should still instruct the model to respond in JSON - otherwise it often produces only whitespace.
  > For a **fixed structure**, use *structured outputs* with a JSON schema instead.
