info:
  name: Generate (Vision)
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{visionModel}}",
        "prompt": "Describe this image in 2-3 sentences.",
        "images": ["{{imageBase64}}"],
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Downloads the sample image ({{imageUrl}}) once and stores it Base64-encoded
        // in the runtime variable "imageBase64". To use your own image, change imageUrl
        // in the environment - the image is re-downloaded automatically.
        const cachedFor = bru.getVar("imageBase64Source");
        const imageUrl = bru.interpolate("{{imageUrl}}");

        if (!bru.getVar("imageBase64") || cachedFor !== imageUrl) {
          const axios = require("axios");
          const response = await axios.get(imageUrl, {
            responseType: "arraybuffer",
            headers: { "User-Agent": "Bruno-Ollama-Collection/1.0" }
          });
          bru.setVar("imageBase64", Buffer.from(response.data).toString("base64"));
          bru.setVar("imageBase64Source", imageUrl);
          console.log("Image loaded:", imageUrl);
        }
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Vision)

  `images` contains **Base64-encoded** images (without a `data:` prefix).

  The pre-request script automatically downloads and encodes `{{imageUrl}}`.
  To use your own image, change the `imageUrl` variable in the environment.

  Suitable models: `gemma3`, `qwen2.5vl`, `llama3.2-vision`, `llava`, `qwen3-vl`, ...
