info:
  name: Generate (Structured Output)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "prompt": "Ollama is 22 years old and busy. Alonso is 23 and available. Return the people in a structured format.",
        "stream": false,
        "format": {
          "type": "object",
          "properties": {
            "people": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "age": {
                    "type": "integer"
                  },
                  "available": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "name",
                  "age",
                  "available"
                ]
              }
            }
          },
          "required": [
            "people"
          ]
        },
        "options": {
          "temperature": 0
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response matches the schema", function () {
          const data = JSON.parse(res.getBody().response);
          expect(data.people).to.be.an("array").with.lengthOf(2);
          data.people.forEach(function (p) {
            expect(p).to.have.all.keys("name", "age", "available");
            expect(p.age).to.be.a("number");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Structured Output)

  `format` accepts a **JSON schema**. Output is constrained to the schema via grammar-based sampling.

  Tips:
  - `temperature: 0` gives more stable results
  - Describing the schema in the prompt as well improves quality
