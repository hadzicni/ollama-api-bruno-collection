info:
  name: Generate (Thinking Level)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{reasoningModel}}",
        "prompt": "Ein Schläger und ein Ball kosten zusammen 1,10 €. Der Schläger kostet 1 € mehr als der Ball. Was kostet der Ball?",
        "think": "high",
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Antwort enthält Text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Thinking Level)

  Einige Modelle (z. B. **gpt-oss**) unterstützen Reasoning-Stufen statt eines Booleans:

  ```json
  "think": "low" | "medium" | "high"
  ```

  Höhere Stufen = längeres Nachdenken = bessere Antworten bei komplexen Aufgaben, aber langsamer.
