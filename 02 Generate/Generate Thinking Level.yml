info:
  name: Generate (Thinking Level)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{reasoningModel}}",
        "prompt": "A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost?",
        "think": "high",
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Thinking Level)

  Some models (e.g. **gpt-oss**) support reasoning levels instead of a boolean:

  ```json
  "think": "low" | "medium" | "high"
  ```

  Higher levels = longer thinking = better answers on complex tasks, but slower.
