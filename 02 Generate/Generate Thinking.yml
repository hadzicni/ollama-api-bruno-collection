info:
  name: Generate (Thinking)
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{thinkingModel}}",
        "prompt": "How many letter \"r\" are in the word \"strawberrry\"?",
        "think": true,
        "stream": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody();
        if (b?.thinking) console.log("Thinking:\n" + b.thinking);
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains text", function () {
          expect(res.getBody().response).to.be.a("string").and.not.be.empty;
        });

        test("Thinking output returned separately", function () {
          expect(res.getBody().thinking).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Thinking)

  With `think: true`, thinking models (e.g. qwen3, deepseek-r1) return their reasoning
  separately in the `thinking` field, and the final answer in `response`.

  `think: false` disables thinking for models that support it.
