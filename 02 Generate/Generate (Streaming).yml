info:
  name: Generate (Streaming)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "prompt": "Write a short haiku about llamas.",
        "stream": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Stream returns NDJSON", function () {
          expect(res.getHeader("content-type")).to.contain("application/x-ndjson");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Generate (Streaming)

  With `stream: true` (the default), Ollama returns **NDJSON** - one JSON object per line:

  ```
  {"model":"llama3.2","created_at":"...","response":"Soft","done":false}
  {"model":"llama3.2","created_at":"...","response":" wool","done":false}
  ...
  {"model":"llama3.2","created_at":"...","response":"","done":true,"done_reason":"stop","total_duration":...}
  ```

  The final object (`done: true`) contains the statistics.
