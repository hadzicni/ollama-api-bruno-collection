info:
  name: Load Model into Memory
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "keep_alive": "{{keepAlive}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Model loaded", function () {
          expect(res.getBody().done_reason).to.equal("load");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Load Model into Memory

  A request **without a `prompt`** only loads the model into memory (`done_reason: "load"`).
  Handy to avoid latency on the first real request.

  Keep it loaded permanently: `"keep_alive": -1`
