info:
  name: Load Model into Memory
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/api/generate"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "keep_alive": "{{keepAlive}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Modell geladen", function () {
          expect(res.getBody().done_reason).to.equal("load");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Load Model into Memory

  Ein Request **ohne `prompt`** lädt das Modell nur in den Speicher (`done_reason: "load"`).
  Praktisch, um die Latenz beim ersten echten Request zu vermeiden.

  Dauerhaft geladen lassen: `"keep_alive": -1`
