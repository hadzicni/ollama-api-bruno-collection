name: Remote Server
color: "#3b82f6"
variables:
  - name: baseUrl
    value: http://192.168.1.100:11434
    description: Start the server with OLLAMA_HOST=0.0.0.0
  - name: apiKey
    value: ollama
    description: Set the token here when using a reverse proxy with auth
  - secret: true
    name: ollamaCloudApiKey
    description: API key from https://ollama.com/settings/keys (web search and cloud)
  - name: model
    value: llama3.2
    description: Default model for chat and generate
  - name: thinkingModel
    value: qwen3
    description: "Model with thinking support (think: true)"
  - name: reasoningModel
    value: gpt-oss:20b
    description: "Model with reasoning levels (think: low/medium/high)"
  - name: toolModel
    value: qwen3
    description: Model with tool calling support
  - name: visionModel
    value: gemma3
    description: Multimodal model (images)
  - name: embedModel
    value: embeddinggemma
    description: Embedding model
  - name: codeModel
    value: qwen2.5-coder
    description: Code model with fill-in-the-middle support
  - name: smallModel
    value: smollm2:135m
    description: Tiny model (~270 MB) for the model lifecycle workflow
  - name: customModelName
    value: bruno-assistant
    description: Name for models created via /api/create
  - name: copyModelName
    value: bruno-copy
    description: Destination name for /api/copy (removed again by "Delete Model")
  - name: keepAlive
    value: 5m
    description: How long a model stays in memory after a request
  - name: imageUrl
    value: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/330px-Cat03.jpg
    description: Image for vision requests (Base64-encoded automatically)
  - name: cloudUrl
    value: https://ollama.com
  - name: cloudModel
    value: gpt-oss:120b
    description: Model for direct cloud requests
  - name: localCloudModel
    value: gpt-oss:120b-cloud
    description: Cloud model via the local server (after "ollama signin")
  - name: ollamaUsername
    value: your-username
    description: ollama.com username (for push)
  - name: blobDigest
    value: sha256:29fdb92e57cf0827ded04ae6461b5931d01fa595843f55d36f5b275a52087dd2
    description: SHA256 digest for blob requests
