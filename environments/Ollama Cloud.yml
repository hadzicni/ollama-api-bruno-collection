name: Ollama Cloud
color: "#a855f7"
variables:
  - name: baseUrl
    value: https://ollama.com
  - secret: true
    name: apiKey
    description: API-Key von https://ollama.com/settings/keys
  - secret: true
    name: ollamaCloudApiKey
    description: API-Key von https://ollama.com/settings/keys
  - name: model
    value: gpt-oss:120b
    description: Standard-Modell für Chat & Generate
  - name: thinkingModel
    value: deepseek-v3.1:671b
    description: "Modell mit Thinking-Support (think: true)"
  - name: reasoningModel
    value: gpt-oss:120b
    description: "Modell mit Reasoning-Level (think: low/medium/high)"
  - name: toolModel
    value: gpt-oss:120b
    description: Modell mit Tool-Calling-Support
  - name: visionModel
    value: qwen3-vl:235b
    description: Multimodales Modell (Bilder)
  - name: embedModel
    value: embeddinggemma
    description: Embedding-Modell
  - name: codeModel
    value: qwen3-coder:480b
    description: Code-Modell mit Fill-in-the-Middle
  - name: smallModel
    value: smollm2:135m
    description: Winziges Modell (~270 MB) für den Modell-Lebenszyklus-Workflow
  - name: customModelName
    value: bruno-assistant
    description: Name für via /api/create erzeugte Modelle
  - name: copyModelName
    value: bruno-copy
    description: Zielname für /api/copy (wird in "Delete Model" wieder gelöscht)
  - name: keepAlive
    value: 5m
    description: Wie lange ein Modell nach dem Request im Speicher bleibt
  - name: imageUrl
    value: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/330px-Cat03.jpg
    description: Bild für Vision-Requests (wird automatisch Base64-kodiert)
  - name: cloudUrl
    value: https://ollama.com
  - name: cloudModel
    value: gpt-oss:120b
    description: Modell für direkte Cloud-Requests
  - name: localCloudModel
    value: gpt-oss:120b-cloud
    description: Cloud-Modell über den lokalen Server (nach "ollama signin")
  - name: ollamaUsername
    value: your-username
    description: ollama.com Benutzername (für Push)
  - name: blobDigest
    value: sha256:29fdb92e57cf0827ded04ae6461b5931d01fa595843f55d36f5b275a52087dd2
    description: SHA256-Digest für Blob-Requests
