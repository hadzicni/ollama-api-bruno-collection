info:
  name: Get Status
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/status"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Cloud status included", function () {
          expect(res.getBody()).to.have.property("cloud");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get Status

  `GET /api/status` - Server status, including whether cloud features are disabled.

  ## Response

  ```json
  {
    "cloud": {
      "disabled": false,
      "source": ""
    }
  }
  ```

  Cloud features can be turned off e.g. via `OLLAMA_NO_CLOUD=1` - `source` then shows where the setting comes from.
