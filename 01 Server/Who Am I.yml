info:
  name: Who Am I (Account)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/me"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Signed in or sign-in URL returned", function () {
          expect([200, 401]).to.include(res.getStatus());
          if (res.getStatus() === 401) {
            console.log("Not signed in - sign in at:", res.getBody().signin_url);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Who Am I

  `POST /api/me` - Shows the **ollama.com account** linked to the local server.

  - `200` -> account info (name, email, plan, ...)
  - `401` -> not signed in; the response contains a `signin_url`

  Sign in via CLI: `ollama signin`
