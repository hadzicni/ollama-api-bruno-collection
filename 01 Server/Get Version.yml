info:
  name: Get Version
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/version"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const version = res.getBody()?.version;
        if (version) {
          bru.setVar("ollamaVersion", version);
          console.log("🦙 Ollama Version:", version);
        }
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Version im SemVer-Format", function () {
          expect(res.getBody().version).to.match(/^\d+\.\d+\.\d+/);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.version
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get Version

  `GET /api/version` – Gibt die installierte Ollama-Version zurück.

  ## Response

  ```json
  { "version": "0.12.6" }
  ```

  Die Version wird zusätzlich in der Laufzeitvariable `ollamaVersion` gespeichert.
