info:
  name: Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Ollama is running", function () {
          expect(res.getBody()).to.contain("Ollama is running");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Health Check

  `GET /` - Returns `Ollama is running` as plain text when the server is reachable.

  Ideal for liveness probes (e.g. Docker/Kubernetes). Use `HEAD /` for a check without a body.
