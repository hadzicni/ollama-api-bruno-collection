info:
  name: Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Ollama läuft", function () {
          expect(res.getBody()).to.contain("Ollama is running");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Health Check

  `GET /` – Liefert `Ollama is running` als Plain Text, wenn der Server erreichbar ist.

  Ideal für Liveness-Probes (z. B. Docker/Kubernetes). Alternativ `HEAD /` für einen Check ohne Body.
